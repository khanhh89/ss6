    <section class="ex6">
        <h3>Center Align Text</h3>
        <p>To just center the next inside an element, use <span class="syntax">text-align:center;</span></p>
        <div class="demo-figure">This text is center</div>
        <div class="democode">
            <h4>Example</h4>
            <div class="code-content">
                <p><span style="color: #bd7481; ">.center</span> &#123; </p>
                <p><span style="color: red;"> text-align</span>:<span style="color: blue;">center</span>;</p>
                <p><span style="color: red;">border</span>:<span style="color: blue;">3px solid green</span>;</p>
                <p>&#125;</p>
            </div>
            <button>Try it Yourself</button>
        </div>
    </section>
</body>
